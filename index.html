<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Search Tool</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --inner:#f4f8f8;
  --text:#111827;
  --sub:#6b7280;
  --line:#d6e8e8;
  --accent:#38a3a5;
  --accent-mid:#2d8a8c;
  --accent-light:#bfd6d5;
  /* 選取態專用色：用配色規範的凸顯橘。
     不用綠——綠在結果區已經是「通過／沒問題」的語意，拿來當選取態會混淆；
     也不用青綠 --accent，那是一般按鈕與連結的顏色。 */
  --brand:#E0820A;
  /* 底色只做極淡的暖色暈染，辨識主要靠實線橘框；
     但也別再更淡了——外層 .cond-box 是 #f4f8f8，太接近就看不出選中。 */
  --brand-soft:#fdf6ec;
  --amber:#f9c97e;
  --amber-light:#ffe8e0;
  --orange:#e16b8c;
  --orange-light:#f8c3cd;
  --shadow:0 1px 4px rgba(0,0,0,.06),0 8px 24px rgba(56,163,165,.10);
  --shadow-sm:0 1px 4px rgba(0,0,0,.05),0 4px 12px rgba(56,163,165,.08);
  --radius:16px;
  /* 字型統一走變數：Noto Sans TC 走 CDN，載不到時退回系統中文字型，中文仍然好看 */
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Microsoft YaHei',sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:var(--font);
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
}

.top-bar{
  height:4px;
  background:linear-gradient(90deg,#ec4f7d,#c38ec7,#6d9eeb,#38a3a5,#a1b860);
}

.page-wrap{
  max-width:1100px;
  margin:auto;
  padding:36px 24px 56px;
}

/* ── Header ── */
.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
  flex-wrap:wrap;
}

/* 公司標記：頁面最下方置中的淺灰小字，純落款用途，不搶版面 */
.company-mark{
  text-align:center;
  margin:40px 0 16px;
  font-size:12px;
  letter-spacing:.06em;
  color:#b0b5ab;
  white-space:nowrap;
}

.header h1{
  font-size:32px;
  font-weight:700;
  color:var(--text);
  line-height:1.2;
  letter-spacing:-.02em;
}

.header-desc{
  margin-top:6px;
  color:var(--sub);
  font-size:14px;
  line-height:1.7;
}

.header-stats{
  display:flex;
  gap:10px;
  flex-shrink:0;
}

.stat-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 22px;
  min-width:82px;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
  transition:transform .2s cubic-bezier(.34,1.4,.64,1), box-shadow .2s;
}

.stat-card:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 6px rgba(0,0,0,.06),0 10px 26px rgba(56,163,165,.16);
}

.stat-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,#38a3a5,#6d9eeb);
}

.stat-num{
  font-size:24px;
  font-weight:700;
  color:var(--accent);
  line-height:1;
}

.stat-label{
  font-size:12px;
  color:var(--sub);
  margin-top:4px;
  font-weight:500;
  letter-spacing:.04em;
}

/* ── Cards ── */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:28px 32px;
  box-shadow:var(--shadow);
  transition:box-shadow .25s, border-color .25s;
}

.card:hover{
  border-color:var(--accent-light);
  box-shadow:0 1px 4px rgba(0,0,0,.06),0 12px 34px rgba(56,163,165,.14);
}

.card + .card{ margin-top:20px; }

/* ── Card header row ── */
.card-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}

.card-header-icon{
  width:32px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

.card-header-icon--green{ background:var(--accent-light); }
.card-header-icon--orange{ background:var(--orange-light); }

.card-header-title{
  font-size:16px;
  font-weight:700;
  color:var(--text);
}

.card-header-sub{
  font-size:12px;
  color:var(--sub);
  margin-left:auto;
}

/* ── Search box ── */
.search-box{
  display:flex;
  align-items:center;
  background:#fff;
  border:2px solid var(--line);
  border-radius:12px;
  padding:0 6px 0 16px;
  gap:10px;
  margin-bottom:22px;
  transition:.2s;
  box-shadow:var(--shadow-sm);
}

.search-box:focus-within{
  border-color:var(--accent-mid);
  box-shadow:0 0 0 4px rgba(56,163,165,.14),var(--shadow-sm);
}

.search-icon{ font-size:16px; flex-shrink:0; color:var(--sub); }

.search-input{
  flex:1;
  height:44px;
  border:none;
  background:transparent;
  font-family:var(--font);
  font-size:14px;
  outline:none;
  color:var(--text);
  min-width:0;
}

.search-input::placeholder{ color:#c0c8c0; }

.search-btn{
  border:none;
  color:#fff;
  font-family:var(--font);
  font-weight:600;
  font-size:14px;
  height:34px;
  padding:0 22px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
  letter-spacing:.04em;
  white-space:nowrap;
  flex-shrink:0;
}

.search-btn--green{ background:var(--accent); }
.search-btn--green:hover{ background:var(--accent-mid); box-shadow:0 4px 14px rgba(56,163,165,.30); transform:translateY(-1px); }
.search-btn--orange{ background:var(--orange); }
.search-btn--orange:hover{ background:#c8567a; box-shadow:0 4px 14px rgba(225,107,140,.30); transform:translateY(-1px); }

/* [互動優化] 查詢中鎖住按鈕時的樣式 */
.search-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

.clear-input-btn{
  border:none;
  background:transparent;
  color:var(--sub);
  font-size:14px;
  width:24px;
  height:24px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:.15s;
  padding:0;
}
.clear-input-btn:hover{ background:var(--inner); color:var(--text); }

/* ── Grid 2 col ── */
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:16px;
}

/* 選擇面板：把「平台／品牌」兩張卡與「查詢範圍」讀數收成同一個面板，
   讀數本來是獨立浮著的粉紅 bar，收進來當底部 footer 才不會多一個色塊 */
.selector-panel{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:16px;
}
.selector-panel .grid-2{ margin-bottom:0; }

/* ── Section block ── */
.section-block{
  background:var(--inner);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px 20px;
  min-width:0;
}

.section-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.section-title{
  font-size:14px;
  font-weight:600;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
}

.section-title-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--amber);
  flex-shrink:0;
}

.section-hint{
  font-size:12px;
  color:var(--sub);
  margin-top:4px;
  padding-left:14px;
}

.clear-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--sub);
  padding:4px 12px;
  border-radius:8px;
  cursor:pointer;
  font-family:var(--font);
  font-size:12px;
  font-weight:500;
  transition:.15s;
  white-space:nowrap;
  flex-shrink:0;
}

.clear-btn:hover{ background:var(--accent-light); color:var(--accent); border-color:var(--accent-mid); }

/* ── Chips ── */
.chips{ display:flex; flex-wrap:wrap; gap:6px; }

/*
 * [#11 優化] chip 顏色改用 CSS 自訂變數統一管理。
 * 每個 chip 透過 JS 注入 --chip-clr（品牌色），
 * inactive 狀態用低透明度，active 狀態直接填滿品牌色。
 * 新增品牌只需在 JS 的 brands 陣列加 color 欄位即可。
 */
.chip{
  --chip-clr: 74,106,74; /* 預設綠色 (R,G,B) */
  border:1px solid rgba(var(--chip-clr),.28);
  background:rgba(var(--chip-clr),.07);
  padding:6px 14px;
  border-radius:8px;
  cursor:pointer;
  /* [互動優化] 點擊時的彈跳感：按下用 transform .1s 機速縮小，
     放開時用 1.18 結尾再彈一下，是回彈手感不會死板。 */
  transition:background-color .15s, border-color .15s, color .15s,
             transform .22s cubic-bezier(.34,1.56,.64,1);
  color:rgb(var(--chip-clr));
  font-family:var(--font);
  font-size:14px;
  font-weight:500;
  letter-spacing:.01em;
  line-height:1.4;
  box-shadow:none !important;
  user-select:none;
  position:relative;
}

.chip:active{
  transform:scale(.88);
  transition:transform .08s ease;
}

.chip:hover{
  background:rgba(var(--chip-clr),.16);
  border-color:rgba(var(--chip-clr),.5);
}

/* active 狀態：填滿品牌色，白字（tryme 例外由 JS 額外處理） */
.chip.active{
  background:rgb(var(--chip-clr));
  border-color:rgb(var(--chip-clr));
  color:#fff;
  box-shadow:0 2px 8px rgba(var(--chip-clr),.32) !important;
}

/* tryme 品牌色淺，active 維持淺色底深字 */
.chip.active[data-id="tryme"]{
  background:#ffcfc9;
  border-color:#f8a79e;
  color:#7a3a35;
}

/* CYBERBIZ 已選但未選品牌：本次不會查詢，以虛線琥珀色表示 */
.chip.active.cb-skip{
  background:#fff7ed;
  border:1px dashed #f59e0b;
  color:#b45309;
  opacity:.86;
}

/* ── Select-all / clear toggle [#2] ── */
.select-all-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--accent);
  font-family:var(--font);
  padding:4px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  transition:.15s;
  white-space:nowrap;
  flex-shrink:0;
  border-color:rgba(var(--chip-clr,46,125,50),.35);
}
.select-all-btn:hover{ background:var(--accent-light); border-color:var(--accent-mid); }

/* ── Copy link button [#3] ── */

/* ── Confirm modal [#4] ── */

/* ── Collapse results [#7] ── */

/* ── Long-press tooltip [#12] ── */
.chip-tooltip{
  position:fixed;
  background:#1a1a1a;
  color:#fff;
  font-size:12px;
  font-family:var(--font);
  padding:6px 12px;
  border-radius:8px;
  pointer-events:none;
  z-index:9999;
  white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  opacity:0;
  transition:opacity .15s;
}
.chip-tooltip.show{ opacity:1; }
.chip-tooltip::after{
  content:'';
  position:absolute;
  top:100%; left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:#1a1a1a;
}

/* ── Summary ── */
/* footer 型讀數：去掉粉紅底與外框，改用細分隔線與面板連成一體 */
.summary{
  display:flex;
  align-items:center;
  gap:8px;
  border-top:1px solid var(--line);
  padding:10px 8px 4px;
  margin-top:12px;
}

.summary-dot{ width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0; }
.summary-text{ color:#b05a6e; font-size:14px; font-weight:500; }
.summary-text strong{ color:#8c3a50; font-weight:700; }

/* ── Mode toggle (關鍵字 / 品牌) ── */
.mode-toggle{
  display:inline-flex;
  background:var(--inner);
  border:1px solid var(--line);
  border-radius:8px;
  padding:4px;
  gap:2px;
  margin-bottom:16px;
}

.mode-btn{
  border:none;
  background:transparent;
  color:var(--sub);
  font-family:var(--font);
  font-size:14px;
  font-weight:600;
  padding:6px 18px;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
  letter-spacing:.02em;
}

.mode-btn:not(.active):hover{ color:var(--text); }

.mode-btn.active{
  background:#fff;
  color:var(--orange);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

/* ── Special platform chips ── */
.sp-chips{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

/* ── Results ── */

.result-platform{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
.result-platform--green{ color:#38a3a5; }
.result-platform--orange{ color:#e16b8c; }

/* ── Message ── */
.msg{
  margin-top:14px;
  padding:12px 16px;
  border-radius:12px;
  font-size:12px;
  font-weight:500;
  display:none;
}

.msg.ok{ background:#e6f4f4; color:#1e6e70; border:1px solid #b0d8d8; }
.msg.err{ background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }

/* ── Tab nav ── */
.tab-nav{
  display:flex;
  gap:0;
  background:var(--inner);
  border:1px solid var(--line);
  border-radius:12px;
  padding:4px;
  margin-bottom:20px;
}

.tab-btn{
  flex:1;
  border:none;
  background:transparent;
  color:var(--sub);
  font-family:var(--font);
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  transition:.18s;
  letter-spacing:.02em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.tab-btn:not(.active):hover{
  color:var(--text);
  background:rgba(255,255,255,.5);
}

.tab-btn.active{
  background:#fff;
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.10);
}

.tab-btn .tab-icon{ font-size:16px; }

.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

/* ── Mobile ── */
@media(max-width:640px){
  .tab-btn{ font-size:12px; padding:8px 10px; gap:4px; }
  .tab-btn .tab-icon{ font-size:14px; }
  .page-wrap{ padding:20px 14px 40px; }
  .header{ margin-bottom:20px; align-items:flex-start; gap:14px; }
  .header h1{ font-size:24px; }
  .header-desc{ font-size:12px; }
  .header-stats{ gap:8px; }
  .stat-card{ padding:10px 14px; min-width:68px; border-radius:12px; }
  .stat-num{ font-size:20px; }
  .stat-label{ font-size:12px; }
  .card{ padding:16px 14px; border-radius:16px; }
  .card + .card{ margin-top:14px; }
  .search-box{ padding:0 6px 0 12px; margin-bottom:16px; }
  .search-input{ height:40px; font-size:14px; }
  .search-btn{ height:30px; font-size:12px; padding:0 14px; border-radius:8px; }
  .grid-2{ gap:8px; margin-bottom:12px; }
  .section-block{ padding:12px 10px; border-radius:12px; }
  .section-title{ font-size:12px; }
  .section-hint{ font-size:12px; }
  .clear-btn{ font-size:12px; padding:4px 8px; }
  .chips{ gap:6px; }
  .chip{ font-size:12px; padding:4px 8px; border-radius:8px; }
  .summary{ padding:10px 12px; }
  .summary-text{ font-size:12px; }
  .result-platform{ font-size:12px; }
  .msg{ font-size:12px; }
  .mode-btn{ font-size:12px; padding:6px 14px; }
}

@media(max-width:390px){
  .page-wrap{ padding:14px 10px 32px; }
  .header h1{ font-size:20px; }
  .card{ padding:12px 10px; }
  .chip{ font-size:12px; padding:4px 8px; }
  .stat-card{ padding:8px 10px; min-width:60px; }
  .stat-num{ font-size:16px; }
}

/* ── 稽核分頁 ── */
.audit-field{ margin-bottom:14px; }
.audit-drop{
  border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center;
  color:var(--sub); font-size:14px; cursor:pointer; background:#fff; transition:.15s;
}
.audit-drop:hover,.audit-drop.dragover{ border-color:var(--accent-mid); background:var(--inner); }
.audit-textarea{
  width:100%; min-height:64px; border:2px solid var(--line); border-radius:12px;
  padding:10px 14px; font-family:var(--font); font-size:14px; resize:vertical;
  outline:none; color:var(--text); background:#fff;
}
.audit-textarea:focus{ border-color:var(--accent-mid); }
.audit-row{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
.audit-hint{ font-size:12px; color:var(--sub); }
.audit-check{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); margin-top:8px; cursor:pointer; }
.audit-thumbs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.audit-thumb{ position:relative; }
.audit-thumb img{ width:42px; height:42px; object-fit:contain; border-radius:6px; border:1px solid var(--line); background:#fff; }
.audit-thumb .rm{ position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; background:#991b1b; color:#fff; font-size:12px; line-height:16px; text-align:center; cursor:pointer; }
.audit-item{
  display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:12px;
  background:var(--inner); border:1px solid var(--line); margin-bottom:8px;
}
.audit-item img{ width:56px; height:56px; object-fit:contain; border-radius:8px; background:#fff; border:1px solid var(--line); flex-shrink:0; }
.audit-item .ai-name{ font-size:14px; color:var(--text); line-height:1.5; }
.audit-item .ai-tags{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
.ai-tag{ font-size:12px; font-weight:600; padding:2px 8px; border-radius:6px; }
.ai-tag.bad{ background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
.ai-tag.warn{ background:#fff7ed; color:#b45309; border:1px solid #fed7aa; }
.ai-tag.match{ background:#e6f4f4; color:#1e6e70; border:1px solid #b0d8d8; }
.ai-tag.maybe{ background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }

/* ── 稽核條件：橫向分頁（取代原本要點開的收合面板）──
   不收合，一眼就看得到有哪些條件可以設；一次只顯示一組，高度不會爆。 */
.cond-box{
  background:var(--inner); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin:16px 0 0; min-width:0;
}
.cond-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.cond-title{ font-size:14px; font-weight:600; color:var(--text); }
/* 三個條件做成跟「掃描深度」一致的卡片：圖示＋標題＋說明，選取態同款 */
.cond-tabs{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.cond-tab{
  position:relative; font-family:inherit; text-align:left;
  display:flex; gap:8px; align-items:flex-start;
  padding:10px 12px; border-radius:12px; cursor:pointer; transition:.15s;
  border:2px dashed var(--line); background:#fff; color:var(--text);
}
.cond-tab:hover{ border-color:var(--brand); }
/* 選取態不再加 box-shadow 外環：2px 實線邊框已經夠明顯，
   疊上外環會變成 4px、看起來太粗（見使用者回饋） */
.cond-tab.active{
  border-style:solid; border-color:var(--brand);
  background:var(--brand-soft);
}
.cond-tab.active.orange{ border-color:var(--orange); background:#fdf3f6; }
/* 已經設定過內容的那一格，即使收合也維持實線，才看得出「這格有東西」 */
.cond-tab.has-value{ border-style:solid; }
.cond-tab .ct-icon{ font-size:16px; line-height:1.3; flex-shrink:0; }
.cond-tab .ct-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.cond-tab .ct-title{ font-size:14px; font-weight:700; color:var(--text); }
.cond-tab .ct-desc{ font-size:12px; color:var(--sub); line-height:1.5; }
/* 這一格有設定東西就點亮，讓使用者不用逐格點開檢查 */
.cond-tab .dot{
  display:none; position:absolute; top:8px; right:8px;
  width:6px; height:6px; border-radius:50%; background:var(--brand);
}
.cond-tab.has-value .dot{ display:block; }
@media(max-width:640px){ .cond-tabs{ grid-template-columns:1fr; } }
.cond-panel{ display:none; }
.cond-panel.show{ display:block; }

/* ── 結果分類切換 ──
   把「這次掃出來分成幾類、各幾筆」直接攤在按鈕上，點一下就只看那一類。
   比起在每列讀小標籤，這樣才看得出「哪些有、哪些沒有」。 */
.seg{ display:flex; gap:0; border:2px solid var(--line); border-radius:10px; overflow:hidden; flex-shrink:0; }
.seg-btn{
  font-family:inherit; font-size:12px; font-weight:600; white-space:nowrap;
  padding:8px 14px; border:none; background:#fff; color:var(--sub);
  cursor:pointer; transition:.15s; border-right:1px solid var(--line);
}
.seg-btn:last-child{ border-right:none; }
.seg-btn:hover:not(:disabled){ background:var(--inner); }
.seg-btn.active{ background:var(--accent); color:#fff; }
.seg-btn.active.k-bad{ background:#991b1b; }
.seg-btn.active.k-maybe{ background:#1d4ed8; }
.seg-btn.active.k-warn{ background:#b45309; }
.seg-btn:disabled{ opacity:.4; cursor:default; }
.seg-btn .n{ font-weight:700; margin-left:4px; }

/* 次要工具收在這個選單裡，篩選列才不會一長排按鈕 */
.more-wrap{ position:relative; flex-shrink:0; }
.more-menu{
  display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:30;
  background:#fff; border:1px solid var(--line); border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.12); padding:8px; min-width:230px;
}
.more-menu.show{ display:block; }
.more-menu .mi{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  font-family:inherit; font-size:14px; color:var(--text); background:transparent;
  border:none; padding:8px 10px; border-radius:8px; cursor:pointer;
}
.more-menu .mi:hover{ background:var(--inner); }
.more-menu .sep{ height:1px; background:var(--line); margin:6px 2px; }
.more-menu .lbl{ font-size:12px; color:var(--sub); padding:4px 10px 2px; }

/* ── 掃描深度：可點選卡片 ── */
.depth-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
/* 未選＝虛線框（看起來就是「還沒決定」），選中＝實線＋主色綠。
   虛線／實線的差別比顏色深淺更容易一眼分辨，不必比對顏色才知道選了哪個。 */
.depth-card{
  display:flex; gap:8px; align-items:flex-start;
  border:2px dashed var(--line); border-radius:12px;
  padding:12px 14px; background:#fff; cursor:pointer; transition:.15s;
}
.depth-card:hover{ border-color:var(--brand); }
.depth-card.on{
  border-style:solid; border-color:var(--brand);
  background:var(--brand-soft);
}
.depth-card input{ margin-top:2px; accent-color:var(--brand); flex-shrink:0; cursor:pointer; }
.depth-body{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.depth-title{ font-size:14px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.depth-desc{ font-size:12px; color:var(--sub); line-height:1.6; }
.depth-badge{ font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-light); border-radius:6px; padding:0 6px; }
.depth-badge.slow{ color:#b45309; background:#fed7aa; }
@media(max-width:640px){ .depth-grid{ grid-template-columns:1fr; } }
</style>
</head>

<body>

<div class="top-bar"></div>

<div class="page-wrap">

  <!-- ── Header ── -->
  <div class="header">
    <div>
      <h1>Product Search Tool</h1>
      <div class="header-desc">快速查詢各大電商平台的商品販售情況，掌握上架狀況與價格資訊。</div>
    </div>
    <div class="header-stats">
      <div class="stat-card">
        <div class="stat-num" id="statPlatform">—</div>
        <div class="stat-label" id="statPlatformLabel">已選平台</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statBrand">—</div>
        <div class="stat-label" id="statBrandLabel">已選品牌</div>
      </div>
    </div>
  </div>

  <!-- ── Tab nav ── -->
  <div class="tab-nav">
    <button class="tab-btn active" id="tabBtnMain"><span class="tab-icon">🔎</span> 電商平台</button>
    <button class="tab-btn" id="tabBtnSp"><span class="tab-icon">🦐</span> 短蝦 / 蝦皮超市</button>
  </div>

  <!-- ══ Tab 1：一般平台搜尋 ══ -->
  <div class="tab-panel active" id="tabPanelMain">
  <div class="card">

    <div class="card-header">
      <div class="card-header-icon card-header-icon--green">🔎</div>
      <div class="card-header-title">電商平台</div>
    </div>

    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input type="text" id="searchInput" class="search-input" placeholder="輸入關鍵字（或直接選下方品牌）">
      <button class="clear-input-btn" id="clearSearchBtn" title="清除">✕</button>
    </div>

    <div class="selector-panel">
    <div class="grid-2">

      <div class="section-block" id="platformBlock">
        <div class="section-head">
          <div>
            <div class="section-title"><span class="section-title-dot"></span>平台</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="select-all-btn" id="platformAllBtn">全選</button>
            <button class="clear-btn" id="platformClearBtn">清除</button>
          </div>
        </div>
        <div class="chips" id="platformGrid"></div>
      </div>

      <div class="section-block" id="brandBlock">
        <div class="section-head">
          <div>
            <div class="section-title"><span class="section-title-dot"></span>品牌</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="select-all-btn" id="brandAllBtn">全選</button>
            <button class="clear-btn" id="brandClearBtn">清除</button>
          </div>
        </div>
        <div class="chips" id="brandGrid"></div>
      </div>

    </div>

    <div class="msg err" id="platformWarn" style="display:none;margin:12px 0 0;">請至少選擇一個平台</div>

    <div class="summary">
      <div class="summary-dot"></div>
      <div class="summary-text" id="selectedCount"></div>
    </div>
    </div><!-- /selector-panel -->

    <!-- 頁內掃描：稽核條件 + 結果，由 scan-console.js 注入 -->
    <div id="mainScanUI"></div>

  </div>
  </div><!-- /tab-panel main -->

  <!-- ══ Tab 2：短蝦 / 蝦皮超市 ══ -->
  <div class="tab-panel" id="tabPanelSp">
  <div class="card">

    <div class="card-header">
      <div class="card-header-icon card-header-icon--orange">🦐</div>
      <div class="card-header-title">短蝦 / 蝦皮超市</div>
      <div class="card-header-sub">關鍵字 或 品牌，擇一搜尋</div>
    </div>

    <!-- 平台選擇 -->
    <div class="sp-chips">
      <div class="chips" id="spPlatformGrid"></div>
    </div>

    <!-- 模式切換 -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeKw">關鍵字搜尋</button>
      <button class="mode-btn" id="modeBrand">品牌篩選</button>
    </div>

    <!-- 關鍵字輸入 -->
    <div id="spKwArea">
      <div class="search-box">
        <span class="search-icon">🔎</span>
        <input type="text" id="spKwInput" class="search-input" placeholder="輸入關鍵字，例如：魚油">
        <button class="clear-input-btn" id="clearSpKwBtn" title="清除">✕</button>
      </div>
    </div>

    <div id="spBrandArea" style="display:none;">
      <div class="search-box" style="margin-bottom:16px;">
        <span class="search-icon">🔎</span>
        <input type="text" id="spBrandKwInput" class="search-input" placeholder="輸入關鍵字（選填），例如：魚油">
        <button class="clear-input-btn" id="clearSpBrandKwBtn" title="清除">✕</button>
      </div>
      <div class="section-block" style="margin-bottom:16px;">
        <div class="section-head">
          <div>
            <div class="section-title"><span class="section-title-dot"></span>選擇品牌</div>
            <div class="section-hint">可多選，每個品牌獨立開啟</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="select-all-btn" id="spBrandAllBtn">全選</button>
            <button class="clear-btn" id="spBrandClearBtn">清除</button>
          </div>
        </div>
        <div class="chips" id="spBrandGrid"></div>
      </div>
    </div>

    <!-- 頁內掃描：稽核條件（可收合）+ 結果，由 scan-console.js 注入（短蝦強制頁內掃描） -->
    <div id="spScanUI"></div>

  </div>
  </div><!-- /tab-panel sp -->

  <div class="company-mark">TSA international CO., LTD.</div>

</div>

<!-- [#12] 長按 tooltip -->
<div class="chip-tooltip" id="chipTooltip"></div>

<script src="phash.js"></script>
<script src="ocr.js"></script>
<script src="scan-store.js"></script>
<script src="promo-check.js"></script>
<script src="scan-console.js"></script>
<script src="app.js"></script>
</body>
</html>
